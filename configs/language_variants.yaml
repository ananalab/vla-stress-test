# Instruction variants on the diagonal (env of task j, instruction about task j).
# Paraphrases written by hand: the first stays close to the original wording,
# the other two change verb and sentence structure.
name: language_variants
suite: libero_goal
tasks: all
episodes: 5
conditions:
  - label: empty
    instruction: ""
    variant: empty
  - label: absurd
    instruction: "sing a song"
    variant: absurd
  - label: paraphrase
    paraphrases:
      0: ["open the drawer in the middle of the cabinet", "pull the cabinet's middle drawer open", "slide out the middle drawer"]
      1: ["place the bowl on the stove", "move the bowl onto the stove", "set the bowl down on the cooktop"]
      2: ["place the wine bottle on top of the cabinet", "move the bottle of wine onto the cabinet", "set the bottle on the cabinet top"]
      3: ["open the top drawer and place the bowl inside", "pull out the upper drawer, then put the bowl in it", "put the bowl in the top drawer after opening it"]
      4: ["place the bowl on top of the cabinet", "move the bowl onto the cabinet", "set the bowl down on the cabinet top"]
      5: ["push the plate to the front of the cooktop", "slide the plate in front of the stove", "move the plate forward until it is in front of the stove"]
      6: ["place the cream cheese in the bowl", "move the cream cheese into the bowl", "drop the cheese box into the bowl"]
      7: ["switch on the stove", "turn the stove on", "start the cooktop"]
      8: ["place the bowl on the plate", "move the bowl onto the plate", "set the bowl down on the dish"]
      9: ["place the wine bottle on the rack", "move the bottle of wine onto the rack", "set the bottle in the wine rack"]
