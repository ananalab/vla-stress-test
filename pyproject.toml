[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-stress"
version = "0.1.0"
description = "Graded robustness tests and residual RL for SmolVLA on LIBERO"
requires-python = ">=3.12"
# Versions are the ones every result in results/ was produced with.
dependencies = [
    "lerobot[smolvla,dataset]==0.6.1",
    "torch==2.11.0",
    "transformers==5.5.4",
    "mujoco==3.8.1",
    "numpy==2.2.6",
    "scipy==1.18.1",
    "pandas==2.3.3",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
    "imageio==2.37.0",
]

[project.optional-dependencies]
# hf-libero pulls robomimic -> egl-probe, which does not build on macOS. On Linux the
# full extra works; on macOS install LIBERO with `make libero-mac` (see README).
libero = ["hf-libero==0.1.4"]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
